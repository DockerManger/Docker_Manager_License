name: Go Checks

# on 使用引号形式(GitHub 官方推荐,YAML 1.1 解析器会把裸 on 当布尔值)
"on":
  push:
    branches: [master]
    # 仅源码改动触发构建;README/workflow 等不影响代码的改动不触发
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/package.json'
      - 'web/vite.config.*'
      - '.github/workflows/go-checks.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test ./...

      - name: go test -race
        run: go test -race ./internal/...

      - name: go build
        run: go build ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: license
          POSTGRES_PASSWORD: licensepass
          POSTGRES_DB: license
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U license -d license"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://license:licensepass@127.0.0.1:5432/license?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: DB integration tests (API + license lifecycle + security)
        run: go test -v ./internal/api/...

  frontend:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Type-check + build
        working-directory: web
        run: npm run build
