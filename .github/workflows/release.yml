name: Release

# tag 触发(如 v1.0.0):构建并发布 Docker 镜像(ghcr.io)
# 安全:镜像只含二进制与前端产物,私钥永远以 volume 挂载,绝不入镜像。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      # 安全提示:构建产物与密钥完全隔离,仓库内任何位置都不应出现 private key。
      # 若发现私钥泄露,参照 README「密钥泄露处理」轮换。
      - name: Verify no keys in build context
        run: |
          if find . -name '*.key' -o -name '*.pem' | grep -v node_modules | grep -q .; then
            echo "::error::检测到密钥文件,终止发布!"
            find . -name '*.key' -o -name '*.pem' | grep -v node_modules
            exit 1
          fi
