name: Release

# on 使用引号形式(GitHub 官方推荐,YAML 1.1 解析器会把裸 on 当布尔值)
# 触发方式:
#   - tag 推送(如 v1.0.0):自动发布,版本取自 tag
#   - 手动 dispatch:可填版本号(默认 dev)
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号(如 v1.0.0;留空则用 dev)
        required: false
        default: dev

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: docker_manager_license
  # tag 触发取 ref_name,手动触发取输入;两者都为空时兜底 dev
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}

jobs:
  # ============ Job 1: 二进制发布(GitHub Release) ============
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build linux/${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags="-s -w -X main.Version=${{ env.RELEASE_VERSION }} -X main.Commit=${GITHUB_SHA}" \
            -o license-server-linux-${{ matrix.arch }} ./cmd/license-server
          tar -czf license-server-linux-${{ matrix.arch }}.tar.gz license-server-linux-${{ matrix.arch }}

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: license-server-linux-*.tar.gz
          generate_release_notes: true

  # ============ Job 2: Docker 镜像推送(Docker Hub + GHCR) ============
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ lower(github.repository) }}:latest
            ghcr.io/${{ lower(github.repository) }}:${{ env.RELEASE_VERSION }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      # 安全提示:构建产物与密钥完全隔离,仓库内任何位置都不应出现 private key。
      # 若发现私钥泄露,参照 README「密钥泄露处理」轮换。
      - name: Verify no keys in build context
        run: |
          if find . -name '*.key' -o -name '*.pem' | grep -v node_modules | grep -q .; then
            echo "::error::检测到密钥文件,终止发布!"
            find . -name '*.key' -o -name '*.pem' | grep -v node_modules
            exit 1
          fi
