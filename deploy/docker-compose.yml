# ============================================================
# Docker Manager License — 单容器全包部署(推荐)
#
# 一条命令部署:
#   docker compose up -d
#
# 镜像内置:license-server + nginx 反代 + PostgreSQL
#   - 对外仅暴露 80 端口(nginx → /license-api/ → license-server:3000)
#   - 数据库在容器内(仅监听 127.0.0.1),数据挂载 ./pgdata 持久化
#   - 私钥首次启动自动生成 → ./private/license.key(0600)
#   - 管理员密码/JWT secret 自动生成并打印在启动日志里
#
# 域名接入(HTTPS 由 Cloudflare Proxied 免费提供):
#   1. DNS 把域名 A 记录指向本机 IP(Cloudflare 开橙色云朵)
#   2. 客户端走 https://<域名>/license-api/api/v1/public/...
#   无需在宿主机配置 nginx!
#
# 端口自定义:修改下面 "80:80" 为 "8080:80" 即可(左侧是宿主端口)。
# ============================================================
services:
  license-server:
    image: zhaoweiwen123/docker_manager_license:latest
    container_name: docker-manager-license
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 私钥目录(0600,绝不可提交 Git;entrypoint 自动修复属主)
      - ./private:/private
      # 数据目录(JWT secret 持久化)
      - ./data:/data
      # PostgreSQL 数据目录(内置数据库,持久化)
      - ./pgdata:/var/lib/postgresql
    # ============ 安全加固(不影响 PostgreSQL/nginx/license-server 正常工作) ============
    # 只读根文件系统:所有可写路径必须来自 volume 或 tmpfs(entrypoint/nginx 日志已适配)
    read_only: true
    tmpfs:
      # nginx pid、postgresql unix socket 锁文件、运行时临时文件
      - /run
      - /tmp
    # 禁止提权(防容器内进程利用 SUID 提权)
    security_opt:
      - no-new-privileges:true
    # 最小能力集:全部丢弃,只保留 entrypoint 切用户/修属主/绑 80 所需
    # (su-exec 需要 SETUID/SETGID;chown 需要 CHOWN/FOWNER;nginx 绑 80 需要 NET_BIND_SERVICE)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # PG 共享内存(dynamic_shared_memory_type=posix 默认走 /dev/shm)
    shm_size: 256mb
    healthcheck:
      # 经内置 nginx 反代检查(80 → 3000 /healthz)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
