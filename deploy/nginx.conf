# Docker Manager License — 内置 nginx 反代(单容器模式)
# /license-api/ 子路径 → license-server(:3000),去掉前缀
# 其余路径(管理后台前端)直接转发。监听 80,HTTPS 由 Cloudflare 边缘(Proxied)提供。
worker_processes 1;
user nginx;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;

    upstream license_server {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _;

        # 公开 API + 管理后台 API(子路径反代,客户端内置地址 manager.kejizero.xyz/license-api)
        location /license-api/ {
            proxy_pass http://license_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理后台前端(SPA)与 healthz
        location / {
            proxy_pass http://license_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
